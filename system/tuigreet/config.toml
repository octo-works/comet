[display]
show_time = true
greeting = "comet"

[remember]
username = true
session = false

[secret]
mode = "characters"
characters = "*"

# shortcut: 15 fps while the login screen is up, raise fps if the rain looks sparse
[background]
kind = "matrix"
fps = 15

[background.matrix]
head_color = "#CCFFCC"
bright_color = "#33FF66"
dim_color = "#006622"
min_length = 6
max_length = 18
min_speed = 0.30
max_speed = 1.10
mutate_chance = 0.02

[theme]
border = "green"
text = "white"
time = "green"
container = "black"
title = "green"
greet = "green"
prompt = "green"
input = "white"
action = "white"
button = "green"
