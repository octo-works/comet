[display]
show_time = true
greeting = "comet"
align_greeting = "center"
issue = false

[layout]
width = 60
window_padding = 2
container_padding = 1
prompt_padding = 1

[layout.widgets]
time_position = "top"
status_position = "bottom"

[remember]
username = true
session = false
user_session = true

[secret]
mode = "characters"
characters = "*"

[keybindings]
command = 2
sessions = 3
background = 4
power = 12

# shortcut: 15 fps while the login screen is up, raise fps if the rain looks sparse
[background]
kind = "matrix"
fps = 24

[background.matrix]
head_color = "#CCFFCC"
bright_color = "#33FF66"
dim_color = "#006622"
min_length = 6
max_length = 18
min_speed = 0.30
max_speed = 1.10
mutate_chance = 0.02

[session]
sessions_dirs = ["/usr/share/wayland-sessions"]
xsessions_dirs = []
environments = []

[power]
use_setsid = false

[theme]
border = "green"
text = "white"
time = "green"
container = "black"
title = "green"
greet = "green"
prompt = "green"
input = "white"
action = "white"
button = "green"
